<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Page 2</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ffecd2,#fcb69f,#ffdde1,#ee9ca7);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
    position:relative;
}

@keyframes bgAnimation{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* Floating Balls */

.ball{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.3);
    animation:float 10s linear infinite;
}

.ball1{
    width:120px;
    height:120px;
    left:10%;
    top:10%;
}

.ball2{
    width:180px;
    height:180px;
    right:10%;
    top:20%;
    animation-duration:15s;
}

.ball3{
    width:100px;
    height:100px;
    left:20%;
    bottom:10%;
    animation-duration:12s;
}

.ball4{
    width:140px;
    height:140px;
    right:20%;
    bottom:5%;
    animation-duration:18s;
}

@keyframes float{

    0%{
        transform:translateY(0px) rotate(0deg);
    }

    50%{
        transform:translateY(-40px) rotate(180deg);
    }

    100%{
        transform:translateY(0px) rotate(360deg);
    }
}

/* Quiz Box */

.quiz-box{
    width:500px;
    padding:40px;
    border-radius:30px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.4);
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
    text-align:center;
    z-index:10;
    animation:popup 1s ease;
}

@keyframes popup{

    0%{
        transform:scale(0.5);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.quiz-box h1{
    color:#5a189a;
    margin-bottom:10px;
}

#question-number{
    font-size:18px;
    color:#444;
    margin-bottom:20px;
}

#question{
    font-size:24px;
    color:#222;
    margin-bottom:30px;
    line-height:35px;
}

/* Options */

.option-btn{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:15px;
    font-size:16px;
    cursor:pointer;
    background:white;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.option-btn:hover{
    transform:scale(1.03);
    background:#ffd6e8;
}

.selected{
    background:#c77dff !important;
    color:white;
}

/* Buttons */

.button-group{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    gap:15px;
}

.btn{
    flex:1;
    padding:15px;
    border:none;
    border-radius:15px;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.4s;
}

#prev-btn{
    background:linear-gradient(135deg,#6c757d,#495057);
}

#submit-btn{
    background:linear-gradient(135deg,#ff758c,#b388ff);
}

.btn:hover{
    transform:scale(1.05);
}

/* Submit Message */

#submit-message{
    margin-top:20px;
    font-size:22px;
    font-weight:600;
    color:#5a189a;
    animation:glow 1s infinite alternate;
}

@keyframes glow{

    from{
        opacity:0.6;
    }

    to{
        opacity:1;
        text-shadow:0 0 15px white;
    }
}

/* Footer */

footer{
    margin-top:20px;
    text-align:center;
    font-size:15px;
    color:white;
    font-weight:500;
    letter-spacing:1px;
    text-shadow:0 2px 5px rgba(0,0,0,0.3);
    z-index:10;
}

/* Responsive */

@media(max-width:600px){

    .quiz-box{
        width:90%;
        padding:30px;
    }

    #question{
        font-size:20px;
    }

    .button-group{
        flex-direction:column;
    }
}

</style>

</head>

<body>

<div class="ball ball1"></div>
<div class="ball ball2"></div>
<div class="ball ball3"></div>
<div class="ball ball4"></div>

<div class="quiz-box">

    <h1>ONLINE QUIZ GAME</h1>

    <div id="question-number"></div>

    <div id="question"></div>

    <div id="options"></div>

    <div class="button-group">

        <button class="btn" id="prev-btn">
            Previous
        </button>

        <button class="btn" id="submit-btn">
            Submit
        </button>

    </div>

    <div id="submit-message"></div>

</div>

<footer>
    © 2026 Online Quiz System | Developed By Zuber Thakur
</footer>

<script>

const questions = [

{
    question:"Which company developed JavaScript?",
    options:[
        "Google",
        "Microsoft",
        "Netscape",
        "Apple"
    ],
    answer:"Netscape"
},

{
    question:"What is the main use of CSS?",
    options:[
        "To add styles to web pages",
        "To create databases",
        "To manage servers",
        "To store files"
    ],
    answer:"To add styles to web pages"
},

{
    question:"Which property changes background color in CSS?",
    options:[
        "color",
        "font-size",
        "background-color",
        "margin"
    ],
    answer:"background-color"
},

{
    question:"Why is JavaScript used in websites?",
    options:[
        "To make websites interactive",
        "To print documents",
        "To create hardware",
        "To increase internet speed"
    ],
    answer:"To make websites interactive"
},

{
    question:"Which method prints output in console?",
    options:[
        "console.log()",
        "print()",
        "write()",
        "echo()"
    ],
    answer:"console.log()"
}

];

let currentQuestion = 0;

let score = 0;

let selectedAnswer = "";

const questionNumber = document.getElementById("question-number");

const question = document.getElementById("question");

const options = document.getElementById("options");

const prevBtn = document.getElementById("prev-btn");

const submitBtn = document.getElementById("submit-btn");

const submitMessage = document.getElementById("submit-message");

function showQuestion(){

    let q = questions[currentQuestion];

    questionNumber.innerHTML =
    `Question ${currentQuestion + 6} of 10`;

    question.innerHTML = q.question;

    options.innerHTML = "";

    selectedAnswer = "";

    q.options.forEach(option => {

        let button = document.createElement("button");

        button.classList.add("option-btn");

        button.innerHTML = option;

        button.onclick = () => {

            selectedAnswer = option;

            document.querySelectorAll(".option-btn")
            .forEach(btn => {

                btn.classList.remove("selected");

            });

            button.classList.add("selected");

        };

        options.appendChild(button);

    });

}

showQuestion();

/* Previous Button */

prevBtn.addEventListener("click", () => {

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

    }

});

/* Submit Button */

submitBtn.addEventListener("click", () => {

    if(selectedAnswer === ""){

        alert("Please Select An Option");

        return;

    }

    if(selectedAnswer === questions[currentQuestion].answer){

        score++;

    }

    currentQuestion++;

    if(currentQuestion < questions.length){

        showQuestion();

    }

    else{

        localStorage.setItem("quiz2Score", score);

        submitMessage.innerHTML =
        "✅ Quiz Submitted Successfully";

        setTimeout(() => {

            window.location.href = "result.html";

        }, 3000);

    }

});

</script>

</body>
</html>
