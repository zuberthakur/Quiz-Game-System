<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Result</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ffecd2,#fcb69f,#ffdde1,#ee9ca7);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
    position:relative;
}

/* Animated Background */

@keyframes bgAnimation{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* Floating Balls */

.ball{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.3);
    animation:float 10s linear infinite;
}

.ball1{
    width:120px;
    height:120px;
    left:10%;
    top:10%;
}

.ball2{
    width:180px;
    height:180px;
    right:10%;
    top:20%;
    animation-duration:15s;
}

.ball3{
    width:100px;
    height:100px;
    left:20%;
    bottom:10%;
    animation-duration:12s;
}

.ball4{
    width:140px;
    height:140px;
    right:20%;
    bottom:5%;
    animation-duration:18s;
}

@keyframes float{

    0%{
        transform:translateY(0px) rotate(0deg);
    }

    50%{
        transform:translateY(-40px) rotate(180deg);
    }

    100%{
        transform:translateY(0px) rotate(360deg);
    }
}

/* Result Box */

.result-box{
    width:500px;
    padding:45px;
    border-radius:30px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.4);
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
    text-align:center;
    z-index:10;
    animation:popup 1s ease;
}

@keyframes popup{

    0%{
        transform:scale(0.5);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* Heading */

.result-box h1{
    color:#5a189a;
    margin-bottom:25px;
    font-size:35px;
}

/* Result Text */

.result-box h2{
    margin:15px 0;
    color:#333;
    font-size:24px;
}

.result-box span{
    color:#7b2cbf;
    font-weight:700;
}

/* Performance */

#performance{
    margin-top:20px;
    font-size:28px;
    font-weight:700;
    color:#ff006e;
    animation:glow 1s infinite alternate;
}

@keyframes glow{

    from{
        opacity:0.6;
    }

    to{
        opacity:1;
        text-shadow:0 0 15px white;
    }
}

/* Buttons */

.button-group{
    margin-top:35px;
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:15px 25px;
    border:none;
    border-radius:15px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    color:white;
    transition:0.4s;
}

#satisfied-btn{
    background:linear-gradient(135deg,#06d6a0,#1b9aaa);
}

#repeat-btn{
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
}

#done-btn{
    background:linear-gradient(135deg,#7b2cbf,#5a189a);
}

.btn:hover{
    transform:scale(1.08);
}

/* Thank You */

.thank-you{
    margin-top:35px;
    font-size:22px;
    font-weight:600;
    color:#5a189a;
    animation:thankGlow 1.5s infinite alternate;
}

@keyframes thankGlow{

    from{
        opacity:0.7;
    }

    to{
        opacity:1;
        text-shadow:0 0 15px white;
    }
}

/* Footer */

footer{
    margin-top:20px;
    text-align:center;
    font-size:15px;
    color:white;
    font-weight:500;
    letter-spacing:1px;
    text-shadow:0 2px 5px rgba(0,0,0,0.3);
    z-index:10;
}

/* Responsive */

@media(max-width:600px){

    .result-box{
        width:90%;
        padding:30px;
    }

    .result-box h1{
        font-size:28px;
    }

    .result-box h2{
        font-size:20px;
    }

    #performance{
        font-size:24px;
    }
}

</style>

</head>

<body>

<!-- Animated Balls -->

<div class="ball ball1"></div>
<div class="ball ball2"></div>
<div class="ball ball3"></div>
<div class="ball ball4"></div>

<!-- Result Box -->

<div class="result-box">

    <h1>ONLINE QUIZ RESULT</h1>

    <h2>
        Name : <span id="user-name"></span>
    </h2>

    <h2>
        Score : <span id="user-score"></span> / 10
    </h2>

    <div id="performance"></div>

    <div class="button-group">

        <button class="btn" id="satisfied-btn">
            Satisfied
        </button>

        <button class="btn" id="repeat-btn">
            Repeat Again
        </button>

        <button class="btn" id="done-btn">
            Done Quiz
        </button>

    </div>

    <div class="thank-you">
        🎉 Thank You So Much For Attending The Quiz 🎉
    </div>

</div>

<footer>
    © 2026 Online Quiz System | Developed By Zuber Thakur
</footer>

<script>

/* Get Data */

const username =
localStorage.getItem("username");

/* FIXED SCORE LOGIC */

const quiz1Score =
parseInt(localStorage.getItem("quiz1Score")) || 0;

const quiz2Score =
parseInt(localStorage.getItem("quiz2Score")) || 0;

const score = quiz1Score + quiz2Score;

/* Elements */

const userName =
document.getElementById("user-name");

const userScore =
document.getElementById("user-score");

const performance =
document.getElementById("performance");

/* Show Data */

userName.innerHTML = username;

userScore.innerHTML = score;

/* Performance Logic */

if(score === 10){

    performance.innerHTML = "🏆 Excellent";

}

else if(score >= 7){

    performance.innerHTML = "🔥 Very Good";

}

else if(score >= 5){

    performance.innerHTML = "👍 Good";

}

else{

    performance.innerHTML = "😔 Poor";

}

/* Buttons */

document.getElementById("satisfied-btn")
.addEventListener("click", () => {

    alert("😊 Thank You For Your Feedback!");

});

document.getElementById("repeat-btn")
.addEventListener("click", () => {

    localStorage.clear();

    window.location.href = "index.html";

});

document.getElementById("done-btn")
.addEventListener("click", () => {

    alert("🎉 Quiz Completed Successfully!");

});

/* Confetti Animation */

for(let i = 0; i < 30; i++){

    let confetti = document.createElement("div");

    confetti.style.width = "10px";

    confetti.style.height = "10px";

    confetti.style.background =
    `hsl(${Math.random()*360},100%,70%)`;

    confetti.style.position = "absolute";

    confetti.style.left =
    Math.random()*100 + "vw";

    confetti.style.top = "-20px";

    confetti.style.borderRadius = "50%";

    confetti.style.animation =
    `fall ${Math.random()*5 + 5}s linear infinite`;

    document.body.appendChild(confetti);

}

/* Falling Animation */

const style = document.createElement('style');

style.innerHTML = `

@keyframes fall{

    0%{
        transform:translateY(0) rotate(0deg);
    }

    100%{
        transform:translateY(120vh) rotate(360deg);
    }
}

`;

document.head.appendChild(style);

</script>

</body>
</html>
